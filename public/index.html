<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sala 5B</title>
    <style>
      :root { --bg: #f3f1ec; --card: #fff; --ink: #1f2a30; --muted: #66737a; --accent: #2f6f6a; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; padding: 16px; }
      main { background: var(--card); width: 100%; max-width: 380px; padding: 28px; border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
      h1 { margin: 0 0 4px; font-size: 22px; }
      p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
      a { display: block; text-align: center; text-decoration: none; padding: 13px; border-radius: 8px; font: 600 16px system-ui; }
      .principal { background: var(--accent); color: #fff; }
      .secundario { margin-top: 12px; border: 1px solid #cfd5d8; color: var(--ink); }
      small { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sala 5B</h1>
      <p>Atendimento em realidade virtual</p>
      <a class="principal" href="/paciente.html">Entrar com código</a>
      <small>No óculos: digite o código que o profissional informar</small>
      <a class="secundario" href="/terapeuta">Painel do profissional</a>
    </main>
  </body>
</html>
